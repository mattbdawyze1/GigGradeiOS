name: iOS build check

on:
  push:
  workflow_dispatch:

jobs:
  # Runs on Linux (always available, free) — tests the offer reading, grading,
  # on-the-way and 4-stop logic.
  core-tests:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Run logic tests
        working-directory: Packages/GigCore
        run: swift test

  # The iPhone app itself can only be compiled on a Mac.
  build-app:
    needs: core-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile app + broadcast extension (simulator, unsigned)
        run: |
          xcodebuild -project GigGrade.xcodeproj -scheme GigGrade \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

  # Unsigned .ipa for sideloading from Windows (e.g. Sideloadly + a free Apple ID).
  unsigned-ipa:
    needs: build-app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project GigGrade.xcodeproj -scheme GigGrade -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GigGrade.app Payload/
          zip -qry GigGrade-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GigGrade-unsigned-ipa
          path: GigGrade-unsigned.ipa
