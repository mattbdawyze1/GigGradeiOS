workflows:
  ios-check:
    name: iOS build check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - supabase   # SUPABASE_URL, SUPABASE_SECRET_KEY
    scripts:
      - name: Logic tests
        script: |
          cd Packages/GigCore
          swift test
      - name: Add Supabase keys (from Codemagic environment variables, never stored in GitHub)
        script: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "WARNING: Supabase variables missing - building WITHOUT cloud sync"
            exit 0
          fi
          cat > Shared/SupabaseSecrets.swift <<EOF
          enum SupabaseSecrets {
              static let url = "$SUPABASE_URL"
              static let secretKey = "$SUPABASE_SECRET_KEY"
          }
          EOF
          echo "Cloud sync keys added for $SUPABASE_URL"
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone app (.ipa)
        script: |
          xcodebuild -project GigGrade.xcodeproj -scheme GigGrade -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GigGrade.app Payload/
          zip -qry GigGrade-unsigned.ipa Payload
    artifacts:
      - GigGrade-unsigned.ipa
