# Generate the Xcode project with:  xcodegen generate
# Change BASE_BUNDLE_ID to something unique to you (e.g. com.yourname.giggrade) — that's the only edit needed.
name: GigGrade
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    BASE_BUNDLE_ID: com.giggrade.app
    APP_GROUP: group.$(BASE_BUNDLE_ID)
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # or pick your team in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "4.3.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GigCore:
    path: Packages/GigCore

targets:
  GigGrade:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: GigCore
      - target: GigGradeBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GigGrade
        ITSAppUsesNonExemptEncryption: false
        GigGradeAppGroup: $(APP_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: GigGrade uses your location to check whether new offers are on the way of your current route.
        NSLocationAlwaysAndWhenInUseUsageDescription: Lets GigGrade keep checking offers against your route while you're in your gig apps.
    entitlements:
      path: App/GigGrade.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    scheme:
      testTargets: []

  GigGradeBroadcast:
    type: app-extension
    platform: iOS
    sources: [BroadcastExtension, Shared]
    dependencies:
      - package: GigCore
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).broadcast
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: GigGrade Offer Reader
        GigGradeAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: BroadcastExtension/GigGradeBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
